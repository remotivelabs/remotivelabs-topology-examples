schema: remotive-topology-instance:0.17

containers:
  3d-car:
    profiles:
      - 3dcar
    image: remotivelabs/3d-car:sha-007fe7f
    ports:
      - "3000:80"
    environment:
      - CUTTLEFISH_PROXY_TARGET=${CUTTLEFISH_PROXY_TARGET:-https://ihu:8443}
    volumes:
      - ./3d_car_mapping.yaml:/config/mapping.yaml:ro
