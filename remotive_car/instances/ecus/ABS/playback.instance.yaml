schema: remotive-topology-instance:0.17

# ABS replaying a recorded drive: the model publishes the ABS signals of the
# recording that ../../android/local_playback.instance.yaml plays back.

platform:
  includes:
    - ../../../platform/remotive-car.platform.yaml

ecus:
  ABS:
    models:
      abs:
        type: container
        container:
          build:
            dockerfile: ../../android/Dockerfile
          command: python -m playback.local.abs
