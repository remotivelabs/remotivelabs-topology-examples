schema: remotive-topology-instance:0.17

# BCM as the Python behavioral model in models/bcm/python: turn signals, beams
# and gears as state machines driven by the SCCM frames.

platform:
  includes:
    - ../../../platform/remotive-car.platform.yaml

ecus:
  BCM:
    models:
      bcm:
        type: container
        container:
          build:
            args:
              - MODEL_PATH=bcm/python
            target: model
            dockerfile: ../../../Dockerfile
          command: python -m bcm
