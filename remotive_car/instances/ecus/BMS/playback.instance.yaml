schema: remotive-topology-instance:0.17

# BMS replaying a recorded drive: the model publishes the battery signals of
# the recording that ../../android/local_playback.instance.yaml plays back.

platform:
  includes:
    - ../../../platform/remotive-car.platform.yaml

ecus:
  BMS:
    models:
      bms:
        type: container
        container:
          build:
            dockerfile: ../../android/Dockerfile
          command: python -m playback.local.bms
          environment:
            # Seconds without VSS input before falling back to SNA (default 5)
            - SNA_ON_MISSING_INPUT_TIMEOUT=3
