schema: remotive-topology-instance:0.17

# IHU as the Python model bridging the SOME/IP events to a separate Cuttlefish
# container over its VHAL gRPC server (port 9300) and GNSS gRPC proxy (port
# 1443). The Cuttlefish container itself comes from the instance that includes
# this file, see ../../android/cuttlefish_vhal_grpc.instance.yaml.

ecus:
  IHU:
    models:
      ihu:
        type: container
        container:
          build:
            args:
              - MODEL_PATH=ihu/python
            target: model
            dockerfile: ../../../Dockerfile
          command: python -m ihu
          environment:
            - VIRTUAL_DEVICE_TYPE=cuttlefish
            - CUTTLEFISH_GNSS_URL=https://cuttlefish:1443/devices/cvd-1
            - CUTTLEFISH_VHAL_URL=cuttlefish:9300
            - PROTOCOL_BUFFERS_PYTHON_IMPLEMENTATION=python
