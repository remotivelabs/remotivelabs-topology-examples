schema: remotive-topology-instance:0.17

# IHU as a Cuttlefish device: the ECU container is the Android image itself,
# with the bridge from the broker built in. Nothing else runs for the IHU.
# The apks and state folders live next to the Android instance that uses this.

ecus:
  IHU:
    container:
      image: remotivelabs/remotivelabs-cuttlefish:16.0.0_r4-1
      environment:
        - CUTTLEFISH_CPUS=${CUTTLEFISH_CPUS:-4}
        - CUTTLEFISH_MEMORY_MB=${CUTTLEFISH_MEMORY_MB:-4096}
        - CUTTLEFISH_DISPLAY_MAIN=width=1600,height=1280,dpi=160,refersh_rate_hz=60
      ports:
        - "6520:6520"
        - "8443:8443"
      volumes:
        - ../../android/cuttlefish/apks:/root/apks
        - ../../android/cuttlefish/state:/root/state
