schema: remotive-topology-instance:0.17

# TCU replaying a recorded drive: the model publishes the position of the
# recording that ../../android/local_playback.instance.yaml plays back.

platform:
  includes:
    - ../../../platform/remotive-car.platform.yaml

ecus:
  TCU:
    models:
      tcu:
        type: container
        container:
          build:
            dockerfile: ../../android/Dockerfile
          command: python -m playback.local.tcu
