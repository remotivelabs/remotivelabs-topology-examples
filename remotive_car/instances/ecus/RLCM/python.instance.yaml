schema: remotive-topology-instance:0.17

# RLCM, the rear light control module, as the Python behavioral model in
# models/rlcm/python: the LIN master on RearLightLIN, translating the BCM's
# requests on CAN to the rear light.

platform:
  includes:
    - ../../../platform/remotive-car.platform.yaml

channels:
  RearLightLIN:
    type: lin
    schedule_table_name: DEVMLIN01Schedule01

ecus:
  RLCM:
    models:
      rlcm:
        type: container
        container:
          build:
            args:
              - MODEL_PATH=rlcm/python
            target: model
            dockerfile: ../../../Dockerfile
          command: python -m rlcm
