schema: remotive-topology-instance:0.17

platform:
  includes:
    - ../../recordings/platform/topology.platform.yaml

containers:
  playback:
    profiles: [playback]
    build:
      dockerfile: Dockerfile
    working_dir: /app
    command: python -m playback.local -s --recording-session ./tesla.recordingsession.yaml
    depends_on:
      - topology-broker.com

ecus:
  TCU:
    models:
      tcu:
        type: container
        container:
          build:
            dockerfile: Dockerfile
          command: python -m playback.local.tcu
  ABS:
    models:
      abs:
        type: container
        container:
          build:
            dockerfile: Dockerfile
          command: python -m playback.local.abs

  SCCM:
    models:
      sccm:
        type: container
        container:
          build:
            dockerfile: Dockerfile
          command: python -m playback.local.sccm

  BMS:
    models:
      bms:
        type: container
        container:
          build:
            dockerfile: Dockerfile
          command: python -m playback.local.bms
          environment:
            # Seconds without VSS input before falling back to SNA (default 5)
            - SNA_ON_MISSING_INPUT_TIMEOUT=3

  PCM:
    models:
      pcm:
        type: container
        container:
          build:
            dockerfile: Dockerfile
          command: python -m playback.local.pcm
          environment:
            # Seconds without VSS input before falling back to SNA (default 5)
            - SNA_ON_MISSING_INPUT_TIMEOUT=3

settings:
  recordings: ../../recordings/
