schema: remotive-topology-instance:0.17

name: remotive_car_agl_cluster

# The DIM as an instrument cluster container, with mocks for the ECUs that send
# what it displays. Every frame the cluster consumes is set directly on a mock,
# from the dashboard, the command line or the tests, with no behavioral model in
# between. The full car around the cluster is the Android instance with the DIM
# model file added, see README.md.

includes:
  - ./../../models/dim.agl_cluster.instance.yaml
  - ./../../common/3d_car/3d_car.instance.yaml

platform:
  includes:
    - ../../platform/remotive-car.platform.yaml

ecus:
  ABS:
    mock: {}
  BMS:
    mock: {}
  BCM:
    mock:
      # The BCM only receives on DriverCan0, a mock there has nothing to send
      channels:
        BodyCan0:
