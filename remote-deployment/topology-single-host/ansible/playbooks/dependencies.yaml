- hosts: remote
  become: true
  gather_facts: true

  vars:
    # APT packages installed on the VM. Only used here, so kept local to this playbook.
    apt_packages:
      - iproute2
      - rsync

  pre_tasks:
    - name: Disable SSH password authentication (enforce key-only login)
      ansible.builtin.copy:
        dest: /etc/ssh/sshd_config.d/99-disable-passwords.conf
        content: |
          PasswordAuthentication no
          ChallengeResponseAuthentication no
        owner: root
        group: root
        mode: "0644"
      notify: Restart ssh

    - name: Update APT cache and install dependencies
      apt:
        name: "{{ apt_packages }}"
        state: present
        update_cache: true

    - name: Check if docker command exists
      ansible.builtin.command: which docker
      register: docker_check
      ignore_errors: true

    - name: Ensure pciutils is installed (for GPU detection)
      apt:
        name: pciutils
        state: present

    - name: Detect an attached NVIDIA GPU
      ansible.builtin.shell: lspci | grep -i nvidia
      register: nvidia_present
      failed_when: false
      changed_when: false

  handlers:
    - name: Restart ssh
      ansible.builtin.service:
        name: ssh
        state: restarted

  roles:
    - role: docker
      # Do not touch docker installation if already installed. We cannot know the origin of docker
      when: docker_check.rc != 0

    - role: remotivebus

    - role: remotive_cli

    - role: nvidia
      # Install the GPU driver + container toolkit only when a card is present.
      when: nvidia_present.rc == 0
