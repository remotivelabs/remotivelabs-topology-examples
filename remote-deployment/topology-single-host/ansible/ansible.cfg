[defaults]
host_key_checking = False
remote_user = ubuntu
interpreter_python = /usr/bin/python3
private_key_file = ~/.ssh/google_compute_engine
callback_whitelist = profile_tasks
gathering = explicit
forks = 10
pipelining = True
# Local roles (e.g. nvidia) first, then the generic roles (docker, remotivebus,
# remotive_cli) reused from the partition sample.
roles_path = roles:../../topology-partition/ansible/roles

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null
